name: site-ops

on:
  schedule:
    - cron: '17 1 * * *'   # UTC 01:17 = 北京 09:17：每日体检+反馈+雷达
    - cron: '17 2 * * 1'   # UTC 01 周一 02:17 = 北京 周一 10:17：再加周报
  workflow_dispatch:

permissions:
  contents: write  # v2.2: 体检回流 _rsi_ledger.md；v3.1: radar/weekly 报告
  issues: write    # v3.3: 体检持续故障自动开 Issue 告警；周报 Issue 推批阅

concurrency:
  group: site-ops
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 站点体检（第一轮，site_check --retry）
        id: sitecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail  # 无此行管道只取 tee 退出码，体检失败步骤也「成功」（假成功防线）
          python3 scripts/site_check.py --retry --json | tee check-result.json

      - name: 二轮复测（首轮 fail 才跑，RULES R3）
        id: rerun
        if: steps.sitecheck.outcome == 'failure'
        shell: bash
        run: |
          set -o pipefail
          echo "首轮 fail，隔 60s 二轮复测再定性……"
          sleep 60
          python3 scripts/site_check.py --retry --json | tee check-result-rerun.json

      - name: 文档漂移防护（RULES R5）
        if: always()
        run: python3 guards/check_docs_drift.py

      - name: 体检回流 RSI 台账（CLOSED-LOOP 第 5 步，v2.2）
        if: always() && steps.sitecheck.outcome != 'skipped'
        run: |
          git config user.name "site-ops-bot"
          git config user.email "actions@github.com"
          RESULT=check-result.json
          if [ -f check-result-rerun.json ]; then RESULT=check-result-rerun.json; fi
          python3 scripts/ledger.py "$RESULT"
          git add _rsi_ledger.md && git commit -m "chore(ops): 体检回流台账 $(date -u +'%Y-%m-%d')" || echo "无变更，跳过"
          git push

      - name: 体检告警（两轮全挂才告警，RULES R3；v3.3 起自动开 Issue）
        if: steps.sitecheck.outcome == 'failure' && steps.rerun.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error title=站点体检失败::首轮+二轮复测均未全绿，判定持续故障（非抖动）"
          # 汇总失败项
          FAILS=$(python3 - <<'PY'
          import json
          for f in ("check-result.json", "check-result-rerun.json"):
              try:
                  d = json.load(open(f))
                  bad = [c["id"] for c in d.get("checks", []) if not c["ok"]]
                  if bad: print(f"{f}: " + ", ".join(bad))
              except Exception: pass
          PY
          )
          # 开 Issue（同日去重：搜当日同标题未关闭 Issue）
          TITLE="⚠️ 站点体检持续故障 $(date -u +'%Y-%m-%d')"
          BODY="## 两轮复测均未全绿（判定持续故障，非抖动）$(printf '\n%s\n' "$FAILS")修复指引：看 Actions 日志 check-result*.json 里 ok=false 的检查项，按 id 对照 scripts/site_check.py 的 CHECKS 定位 URL；修复后手动 workflow_dispatch 复跑确认全绿，然后关闭本 Issue。"
          EXISTS=$(gh issue list --state open --search "$TITLE" --json number --jq 'length')
          if [ "$EXISTS" = "0" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
            echo "已开告警 Issue（GitHub 会邮件通知 watcher）"
          else
            echo "当日告警 Issue 已存在，不重复开"
          fi
          exit 1

  autopilot:
    # v3.1 零口令心跳：每日 09:17 反馈+雷达；周一 10:17 加周报。
    # ima 凭据走 Secrets（IMA_CLIENT_ID/IMA_API_KEY/IMA_KB_ID）；
    # QQ 邮箱配置走 Secret IMA_EMAIL_JSON。缺哪个环节跳过哪个，心跳不断。
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 还原邮箱配置
        run: |
          if [ -n "${{ secrets.IMA_EMAIL_JSON }}" ]; then
            mkdir -p ~/.config/ima
            printf '%s' '${{ secrets.IMA_EMAIL_JSON }}' > ~/.config/ima/email.json
          fi

      - name: 判断是否周一（周报叠加）
        id: ismon
        run: echo "mon=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: autopilot 心跳
        continue-on-error: true
        env:
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          IMA_KB_ID: ${{ secrets.IMA_KB_ID }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python3 scripts/autopilot.py weekly
          else
            python3 scripts/autopilot.py daily
          fi

      - name: 报告入库（radar/weekly 最新一份）
        run: |
          git config user.name "site-ops-bot"
          git config user.email "actions@github.com"
          git add docs/radar-latest.md docs/weekly-latest.md docs/radar-history.md || true
          git commit -m "chore(autopilot): 心跳报告 $(date -u +'%Y-%m-%d')" || echo "无变更"
          git pull --rebase --autostash || git pull --rebase || true
          git push

      - name: 周报 Issue 推批阅（v3.3，站长批阅位）
        if: steps.ismon.outputs.mon == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 当日确有新周报才开（防非周报日手动重跑误开）
          TODAY=$(date -u +'%Y-%m-%d')
          if ! grep -q "飞轮周报 · ${TODAY}" docs/weekly-latest.md 2>/dev/null; then
            echo "今日无新周报，跳过"; exit 0
          fi
          TITLE="📋 飞轮周报待批阅 ${TODAY}"
          EXISTS=$(gh issue list --state open --search "$TITLE" --json number --jq 'length')
          if [ "$EXISTS" = "0" ]; then
            gh issue create --title "$TITLE" --body-file docs/weekly-latest.md
            echo "已开周报 Issue（GitHub 通知 watcher，勾选 1-2 条选题进下周池后关闭）"
          else
            echo "当日周报 Issue 已存在，不重复开"
          fi

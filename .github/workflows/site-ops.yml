name: site-ops

on:
  schedule:
    - cron: '17 1 * * *'  # UTC 01:17 = 北京时间 09:17
  workflow_dispatch:

permissions:
  contents: write  # v2.2: 体检回流 _rsi_ledger.md 需要写权限

concurrency:
  group: site-ops
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 站点体检（第一轮，site_check --retry）
        id: sitecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail  # 无此行管道只取 tee 退出码，体检失败步骤也「成功」（假成功防线）
          python3 scripts/site_check.py --retry --json | tee check-result.json

      - name: 二轮复测（首轮 fail 才跑，RULES R3）
        id: rerun
        if: steps.sitecheck.outcome == 'failure'
        shell: bash
        run: |
          set -o pipefail
          echo "首轮 fail，隔 60s 二轮复测再定性……"
          sleep 60
          python3 scripts/site_check.py --retry --json | tee check-result-rerun.json

      - name: 文档漂移防护（RULES R5）
        if: always()
        run: python3 guards/check_docs_drift.py

      - name: 体检回流 RSI 台账（CLOSED-LOOP 第 5 步，v2.2）
        if: always() && steps.sitecheck.outcome != 'skipped'
        run: |
          git config user.name "site-ops-bot"
          git config user.email "actions@github.com"
          RESULT=check-result.json
          if [ -f check-result-rerun.json ]; then RESULT=check-result-rerun.json; fi
          python3 scripts/ledger.py "$RESULT"
          git add _rsi_ledger.md && git commit -m "chore(ops): 体检回流台账 $(date -u +'%Y-%m-%d')" || echo "无变更，跳过"
          git push

      - name: 体检告警（两轮全挂才告警，RULES R3）
        if: steps.sitecheck.outcome == 'failure' && steps.rerun.outcome != 'success'
        run: |
          echo "::error title=站点体检失败::首轮+二轮复测均未全绿，判定持续故障（非抖动）"
          echo "=============================================="
          echo " ⚠️  chai 站体检持续故障 —— 修复指引："
          echo "   1. 看 check-result.json 与 check-result-rerun.json 里 ok=false 的检查项"
          echo "   2. 若两轮失败项不同 → 仍疑似抖动，手动 workflow_dispatch 再复跑一轮"
          echo "   3. 若失败项一致 → 按 id 对照 site_check.py 的 CHECKS 定位 URL 修复"
          echo "   4. 修复后手动 workflow_dispatch 复跑一次确认全绿"
          echo "=============================================="
          exit 1

  radar:
    # v3.0 兴趣雷达：每日抓四榜热点，命中报告提交仓内 docs/radar-latest.md
    # （ima 入库由 WorkBuddy 侧「扫热点选题」承接——CI 无 ima 凭据，红线：凭证不进 CI）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 兴趣雷达扫四榜
        continue-on-error: true
        run: |
          python3 scripts/interest_radar.py --keywords "AI,拆书,读书,写作,成长" > docs/radar-latest.md 2> radar-stderr.log || true
          echo "--- stderr ---"; cat radar-stderr.log || true

      - name: 雷达报告入库（仓内最新一份）
        run: |
          git config user.name "site-ops-bot"
          git config user.email "actions@github.com"
          git add docs/radar-latest.md
          git commit -m "chore(radar): 兴趣雷达扫描 $(date -u +'%Y-%m-%d')" || echo "无变更"
          git push
